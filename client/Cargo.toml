[package]
name = "quiethop-client-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "quiethop_client"
path = "src/lib.rs"

[features]
# The low level dialer takes a caller supplied TLS connector, so it can reach a
# relay whose certificate is not under the host's native roots. That is what a
# test needs and what the customer facing API must not offer, because it is a
# way around the SDK's own trust roots. Off by default, and nothing but a dev
# dependency may turn it on.
test-util = []

[dependencies]
quiethop-crypto = { path = "../quiethop-crypto" }
tokio = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
rsa = { workspace = true }
num-bigint-dig = { version = "0.8", features = ["rand"] }
num-traits = { workspace = true }
rand_core = { workspace = true }
rand = { workspace = true }
x25519-dalek = { workspace = true }
url = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
