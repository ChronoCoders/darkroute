[package]
name = "quiethop-client-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "quiethop_client"
path = "src/lib.rs"

[dependencies]
quiethop-crypto = { path = "../quiethop-crypto" }
tokio = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
rsa = { workspace = true }
num-bigint-dig = { version = "0.8", features = ["rand"] }
num-traits = { workspace = true }
rand_core = { workspace = true }
rand = { workspace = true }
x25519-dalek = { workspace = true }
# Registry signature verification. verify_strict rejects non-canonical and
# small-order keys, which plain verify accepts.
ed25519-dalek = "3.0.0"
# 0.22 so it resolves to the 0.22.1 already in Cargo.lock.
base64 = "0.22"
serde_json = { workspace = true }
url = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }

[dev-dependencies]
tempfile = "3"
