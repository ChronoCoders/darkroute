[workspace]
resolver = "2"
members = ["quiethop-crypto", "relay", "client", "quiethop-client"]

[workspace.package]
edition = "2021"
license = "BUSL-1.1"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rsa = "0.9"
sha2 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
x25519-dalek = { version = "2", features = ["getrandom"] }
snow = { version = "0.10.0", default-features = false, features = ["use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.8"
# Registry signature verification. verify_strict rejects non-canonical and
# small-order keys, which plain verify accepts.
ed25519-dalek = "3.0.0"
# 0.22 so it resolves to the 0.22.1 already in Cargo.lock.
base64 = "0.22"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = "0.26"
rustls-native-certs = "0.8"
rustls-pemfile = "2"
futures-util = "0.3"

# RSA 2048 bit key generation costs about 20 seconds per key in an unoptimised
# build, measured on this machine, and the integration tests generate one per
# test. With this override it is about 0.23 seconds, which took the serial
# integration suite from 283.6 seconds to 11.3 seconds.
#
# Source: the rsa 0.9.10 README as published on docs.rs, at
# docs.rs/crate/rsa/0.9.10, which is where both sentences were read. The GitHub
# master README carries the first but not the second, so checking there will not
# find the num-bigint-dig advice.
#
#   "If you encounter unusually slow key generation time while using
#    `RsaPrivateKey::new` you can try to compile in release mode"
#
#   "If you don't want to turn on optimizations for all dependencies, you can
#    only optimize the `num-bigint-dig` dependency. This should give most of the
#    speedups."
#
# Per-package overrides cannot set panic, lto or rpath, which is why this is
# opt-level alone. The test profile inherits dev, which is why this one block
# covers cargo test as well; that was confirmed by measurement rather than
# assumed.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
